<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimuProcess - Jus | Auth Supabase</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#fff7ed;margin:0;padding:20px}
.card{max-width:480px;margin:auto;background:white;padding:22px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.1)}
h1{text-align:center;color:#ea580c} h2{color:#ea580c}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
button{width:100%;padding:13px;background:#ea580c;color:white;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:8px}
button.secondary{background:#111827}
.hidden{display:none}
.result{background:#fef3c7;padding:14px;border-radius:10px;margin-top:12px}
.histo{font-size:13px;background:#f9fafb;padding:10px;border-radius:10px;margin-top:10px}
</style>
</head>
<body>

<div class="card" id="authCard">
  <h1>🍊 SimuProcess - Jus</h1>
  <p style="text-align:center">Connectez-vous avec votre Gmail</p>
  <input id="email" type="email" placeholder="votre@gmail.com" required>
  <input id="password" type="password" placeholder="Mot de passe (min 6 caractères)" required>
  <button onclick="signUp()">Créer un compte - Sign Up</button>
  <button class="secondary" onclick="signIn()">Se connecter - Sign In</button>
  <p id="authMsg" style="color:red;text-align:center"></p>
  <p style="font-size:12px;text-align:center;color:#666">Chaque Gmail ne peut être utilisé qu'une seule fois pour créer un compte.</p>
</div>

<div class="card hidden" id="appCard">
  <h2>Bienvenue <span id="userEmail"></span> 👋</h2>
  <button class="secondary" onclick="signOut()">Déconnexion</button>
  <hr>
  <h2>Simulation - Production de Jus</h2>
  <label>Quantité de fruits (kg) - 100 à 10000</label>
  <input id="fruits" type="number" min="100" max="10000" value="1000">
  <label>Température de pasteurisation (°C) - 70 à 95</label>
  <input id="temp" type="number" min="70" max="95" value="85">
  <label>Durée (min) - 5 à 60</label>
  <input id="duree" type="number" min="5" max="60" value="15">
  <label>Sucre ajouté (%) - 0 à 20</label>
  <input id="sucre" type="number" min="0" max="20" value="5">
  <button onclick="simuler()">Lancer la simulation</button>
  <div id="resultat"></div>
  <div id="histo"></div>
</div>

<script>
const SUPABASE_URL = "https://xslhsuojufwxugdrbeg.supabase.co";
const SUPABASE_KEY = "sb_publishable_RuapueeNtkkZsuMRtRWDuA_8GTP6dTk";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function signUp(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  if(!email.includes('@')) return document.getElementById('authMsg').innerText="Email invalide - utilisez un Gmail valide";
  if(password.length<6) return document.getElementById('authMsg').innerText="Mot de passe trop court (min 6)";
  const {data,error}=await supabaseClient.auth.signUp({email,password});
  if(error) document.getElementById('authMsg').innerText = error.message.includes('already') ? "Ce Gmail est déjà utilisé. Essayez de vous connecter." : error.message;
  else { document.getElementById('authMsg').style.color="green"; document.getElementById('authMsg').innerText="Compte créé ! Vérifiez votre email puis connectez-vous."; }
}
async function signIn(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error) document.getElementById('authMsg').innerText="Email ou mot de passe incorrect";
  else checkUser();
}
async function signOut(){ await supabaseClient.auth.signOut(); location.reload(); }
async function checkUser(){
  const {data:{user}}=await supabaseClient.auth.getUser();
  if(user){
    document.getElementById('authCard').classList.add('hidden');
    document.getElementById('appCard').classList.remove('hidden');
    document.getElementById('userEmail').innerText=user.email;
    loadHisto();
  }
}
async function simuler(){
  const fruits=parseFloat(document.getElementById('fruits').value);
  const temp=parseFloat(document.getElementById('temp').value);
  const duree=parseFloat(document.getElementById('duree').value);
  const sucre=parseFloat(document.getElementById('sucre').value);
  // Validation des valeurs numériques
  if(isNaN(fruits)||isNaN(temp)||isNaN(duree)||isNaN(sucre)) return alert("Toutes les valeurs doivent être numériques");
  if(fruits<100||fruits>10000) return alert("Fruits doit être entre 100 et 10000 kg");
  if(temp<70||temp>95) return alert("Température doit être entre 70 et 95°C");
  if(duree<5||duree>60) return alert("Durée doit être entre 5 et 60 min");
  if(sucre<0||sucre>20) return alert("Sucre doit être entre 0 et 20%");

  const rendement = fruits * 0.62 * (temp>=80 ? 0.98 : 0.92);
  const jus = Math.round(rendement);
  const cout = Math.round(fruits*0.8 + duree*2);
  const resultat = {fruits_kg:fruits, temperature:temp, duree_min:duree, sucre_pct:sucre, jus_litres:jus, cout_dh:cout};
  document.getElementById('resultat').innerHTML=`<div class="result"><b>Résultat :</b><br>🥤 Jus produit : <b>${jus} L</b><br>💰 Coût estimé : <b>${cout} DH</b><br>📊 Rendement : ${(jus/fruits*100).toFixed(1)}%</div>`;

  const {data:{user}}=await supabaseClient.auth.getUser();
  if(user){
    await supabaseClient.from('simulations').insert([{user_id:user.id, email:user.email, parametres:{fruits,temp,duree,sucre}, resultat:resultat}]);
    loadHisto();
  }
}
async function loadHisto(){
  const {data:{user}}=await supabaseClient.auth.getUser();
  const {data}=await supabaseClient.from('simulations').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(5);
  if(data && data.length){
    let html="<h3>Historique (5 dernières)</h3>";
    data.forEach(s=>{ html+=`<div class="histo">${new Date(s.created_at).toLocaleString()} - ${s.resultat.jus_litres} L - ${s.resultat.cout_dh} DH</div>` });
    document.getElementById('histo').innerHTML=html;
  }
}
checkUser();
</script>
</body>
</html>
