<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — SimuProcess</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; background: #f4f6fb; display: grid; place-items: center; min-height: 100vh; margin: 0; }
    .box { background: #fff; padding: 28px; border-radius: 14px; width: 100%; max-width: 380px; box-shadow: 0 6px 24px rgba(15,23,42,0.08); }
    h2 { margin: 0 0 6px; }
    p.sub { margin: 0 0 18px; color: #64748b; font-size: 0.9rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 14px; box-sizing: border-box; }
    button { width: 100%; padding: 11px; background: #ea580c; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .err { background: #fef2f2; color: #b91c1c; padding: 8px 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 12px; }
    .link { text-align: center; margin-top: 14px; font-size: 0.88rem; }
  </style>
</head>
<body>
  <div class="box">
    <h2>🍊 SimuProcess</h2>
    <p class="sub">Connexion à votre espace</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <label>Email</label>
      <input type="email" name="email" required />
      <label>Mot de passe</label>
      <input type="password" name="password" required />
      <button type="submit">Se connecter</button>
    </form>
    <div class="link">Pas de compte ? <a href="/register">S'inscrire</a></div>
  </div>
</body>
</html>
